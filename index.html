<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Глоссарий: определения по английскому для IT</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1f2328;--mut:#6b7280;--line:#e2e0d8;--acc:#2f5fd0;--chip:#eef1fb}
@media(prefers-color-scheme:dark){:root{--bg:#16181c;--card:#20242a;--ink:#e8eaed;--mut:#9aa3ad;--line:#343a42;--acc:#7aa2ff;--chip:#2a3140}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:18px 14px 60px}
h1{font-size:20px;margin:0 0 4px}.sub{color:var(--mut);font-size:14px;margin-bottom:14px}
input[type=search]{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:8px;cursor:pointer}
button.on{border-color:var(--acc);color:var(--acc);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0}
.t{font-size:18px;font-weight:700}.ru{color:var(--mut);font-size:14px}
.ref{border-left:4px solid var(--acc);padding:6px 12px;margin:8px 0;font-size:17px}
.w{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.w span{background:var(--chip);border-radius:7px;padding:2px 8px;font-size:14px}
.w b{font-weight:600}.note{font-size:14px;color:var(--mut);margin-top:6px}.gh{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin:18px 0 0}
.hidden{display:none}
</style></head><body><main>
<h1>Глоссарий: определения по английскому для IT</h1>
<div class="sub">Essential English for IT Students, часть 1 (Unit 6, Unit 7) и дополнительные термины, простыми словами. ОС можно назвать hidden software. Уровни OSI объясняются оборотом «is responsible for».</div>
<input type="search" id="q" placeholder="Поиск по термину, переводу или тексту">
<div class="tabs" id="tabs"></div>
<div id="list"></div>
<script>
const G={all:'Все',soft:'Software',net:'Networks',topo:'Топологии',osi:'OSI model',inet:'Internet connection',lang:'Programming languages'};
const ITEMS=[{"g":"soft","t":"Software (types of software)","ru":"программное обеспечение и его виды","ref":"Software is a set of programs and instructions that tell a computer what to do. There are two main kinds: system software and application software."},{"g":"soft","t":"System software","ru":"системное ПО","ref":"System software is the basic software that runs the computer's hardware. It works between the hardware and the applications and gives them a place to run. Examples: operating system, firmware and device drivers."},{"g":"soft","t":"Application software","ru":"прикладное ПО","ref":"Application software is a program that helps the user do one specific job, for example, write a text or browse the web. It cannot work alone: it needs system software. Examples: word processor, database, web browser."},{"g":"soft","t":"Operating system","ru":"операционная система","ref":"An operating system is the main program of a computer. It manages the hardware, gives the user an interface and lets other programs run. It works in the background, so it is called hidden software."},{"g":"soft","t":"Firmware","ru":"прошивка","ref":"Firmware is permanent software stored in the computer's ROM (read-only memory). It is a kind of system software."},{"g":"soft","t":"Device driver","ru":"драйвер устройства","ref":"A device driver is a program that controls one specific piece of hardware, for example, a printer. It is a kind of system software."},{"g":"soft","t":"CLI (Command Line Interface)","ru":"интерфейс командной строки","ref":"CLI (command line interface) is a way to work with a computer by typing commands as lines of text. You need only a keyboard."},{"g":"soft","t":"GUI (Graphical User Interface)","ru":"графический интерфейс","ref":"GUI (graphical user interface) is an interface with pictures. You use a mouse to click icons and choose items in menus. It is based on WIMP: windows, icons, menus, pointer."},{"g":"soft","t":"Open-source software","ru":"ПО с открытым исходным кодом","ref":"Open-source software is software whose owner allows everyone to use, study, change and share it for any purpose. Linux is an example."},{"g":"soft","t":"Preemptive and cooperative multitasking","ru":"вытесняющая и кооперативная многозадачность","ref":"Multitasking means the computer runs several programs at the same time by switching between tasks. In preemptive multitasking the operating system gives each process a time slice and decides how long it runs. Important tasks, for example background tasks of the OS, get bigger slices. In cooperative multitasking the operating system never switches the tasks itself: a task uses the CPU until it gives it up voluntarily, so all the processes must cooperate."},{"g":"soft","t":"Single-tasking and multitasking OS","ru":"однозадачная и многозадачная ОС","ref":"A single-tasking system can run only one program at a time, and nothing else is done while it works. MS-DOS is an example. A multitasking system lets the CPU run more than one program at the same time by switching between tasks. Windows, Linux and Mac OS are multitasking systems."},{"g":"soft","t":"Spreadsheet","ru":"электронная таблица","ref":"A spreadsheet is a computer application for organization, analysis and storage of data in a tabular form. Example: Excel."},{"g":"lang","t":"Low-level languages","ru":"языки низкого уровня","ref":"Computers understand directly only machine code, which consists of 1s and 0s (binary code). Machine code and assembly languages are called low-level languages, because they are closer to the hardware. Assembly languages use abbreviations such as ADD, SUB, MUL to represent instructions, and a program called an assembler translates them into machine code. Low-level languages are quite complex and restricted to particular machines."},{"g":"lang","t":"High-level languages","ru":"языки высокого уровня","ref":"High-level languages are closer to the English language, so programs are easier to write, and they work on different types of computers. Examples: FORTRAN, BASIC, Pascal, C, C++, Java, Python. A program written in a high-level language must be translated into machine code by a compiler or an interpreter. Programmers write source code in both low-level and high-level languages."},{"g":"lang","t":"OOP (Object-Oriented Programming)","ru":"объектно-ориентированное программирование","ref":"OOP is a way of programming that is based on classes and objects. An object is a software item that keeps data and functions together. OOP makes code more intuitive and reusable, so program development is faster. It has four principles: encapsulation, inheritance, polymorphism and abstraction."},{"g":"lang","t":"Encapsulation","ru":"инкапсуляция","ref":"Encapsulation is bundling data and program instructions (functions) into one unit, called an object. It is the key feature of OOP."},{"g":"lang","t":"Inheritance","ru":"наследование","ref":"Inheritance is the ability of one class of objects to use the properties and behavior of another class. Example: a Square is a kind of Rectangle, so it automatically gets all properties of rectangles."},{"g":"lang","t":"Polymorphism","ru":"полиморфизм","ref":"Polymorphism means that different objects can receive the same instruction but deal with it in different ways. Example: right-click on a right triangle and on an equilateral triangle: each one explains its own properties."},{"g":"lang","t":"Abstraction","ru":"абстракция","ref":"Abstraction means showing only the important features of an object and hiding the details. (Not defined in the textbook text; it is the standard fourth principle of OOP.)"},{"g":"net","t":"Network (types of network)","ru":"сеть и классификация сетей","ref":"A network is a group of computers and devices connected together to share data. Networks differ by area (LAN, MAN, WAN), by architecture (peer-to-peer, client-server), by topology and by connection type (wired, wireless)."},{"g":"net","t":"Peer-to-peer network","ru":"одноранговая сеть","ref":"A peer-to-peer network is a network where all computers are equal. They share files and devices without a separate server."},{"g":"net","t":"Client-server network","ru":"сеть «клиент-сервер»","ref":"In a client-server network, one main computer, the server, stores data and gives it to the other computers, the clients."},{"g":"net","t":"Modem","ru":"модем","ref":"A modem is a device which converts an analog signal into a digital one."},{"g":"net","t":"Router","ru":"маршрутизатор","ref":"A router is a device that sends data packets from one network to another, so several devices can share one Internet connection (Layer 3)."},{"g":"net","t":"Hub","ru":"концентратор (хаб)","ref":"A hub is a node that sends data to every connected device without any restriction (Layer 1)."},{"g":"net","t":"Switch","ru":"коммутатор","ref":"A switch is a device that connects computers in a network and sends data only to the specific device that needs it, using its MAC address (Layer 2)."},{"g":"net","t":"Bridge","ru":"мост","ref":"A bridge is a device that connects networks that use the same protocol (Layer 2)."},{"g":"net","t":"Gateway","ru":"шлюз","ref":"A gateway is a device or software that lets two networks with different protocols communicate."},{"g":"net","t":"Network range","ru":"дальность сети","ref":"Range is the distance over which a wireless network works. It depends on the type of 802.11 protocol, the strength of the device transmitter and the surrounding area: walls and metal frames can reduce the range of a WLAN by 25%."},{"g":"net","t":"Repeater","ru":"повторитель","ref":"A repeater forwards the wireless signal to access points or routers, so it increases the range of a network."},{"g":"net","t":"Bandwidth","ru":"пропускная способность","ref":"Bandwidth is how much information can pass through a data connection in a given time, measured in bits per second."},{"g":"net","t":"Latency","ru":"задержка","ref":"Latency is the time delay between a user's request and the response of the system, usually measured in milliseconds (ms)."},{"g":"net","t":"MAN (Metropolitan Area Network)","ru":"городская сеть","ref":"A MAN spans an entire city."},{"g":"net","t":"LAN (Local Area Network)","ru":"локальная сеть","ref":"A LAN covers a small geographical area, such as an office, a home, a building or a group of buildings."},{"g":"net","t":"WAN (Wide Area Network)","ru":"глобальная сеть","ref":"A WAN covers a country or a continent. The largest WAN is the Internet, which connects millions of people all over the world."},{"g":"net","t":"Wired and wireless networks","ru":"проводные и беспроводные сети","ref":"Wired networks send data through cables: coaxial or twisted-pair cables, and fiber optic cables for longer distances. Wireless networks use electromagnetic waves, such as radio waves, to send data."},{"g":"inet","t":"DSL (Digital Subscriber Line)","ru":"цифровая абонентская линия","ref":"DSL is a high-speed Internet connection that works over telephone lines. It lets one phone line be used for the Internet and for voice calls at the same time."},{"g":"inet","t":"Cable Internet","ru":"кабельный Интернет","ref":"Cable Internet is a connection that uses a coaxial cable and a cable modem. It is reliable, but you share the bandwidth with your neighbors."},{"g":"inet","t":"Fiber-optic Internet","ru":"оптоволоконный Интернет","ref":"Fiber-optic Internet uses fiber-optic cables instead of copper wires and sends data as pulses of light. It is the fastest wired connection and works over long distances."},{"g":"inet","t":"Wireless connection","ru":"беспроводное подключение","ref":"The three wireless technologies widely used today are Wi-Fi, cellular and satellite Internet."},{"g":"inet","t":"Wi-Fi","ru":"Wi-Fi","ref":"Wi-Fi uses radio waves to connect devices without wires, usually in a local area network. A device connects to the Internet over Wi-Fi through a wireless router."},{"g":"inet","t":"Satellite Internet","ru":"спутниковый Интернет","ref":"Satellite Internet gives access to the Net through a geostationary satellite. It needs a satellite dish and a modem, and it works where cable or DSL is not available, but the signal travels far, so there can be a delay (latency)."},{"g":"inet","t":"Cellular network","ru":"сотовая сеть","ref":"A cellular network is a radio network divided into areas called cells. Each cell has a base station (cell tower) that carries voice and data."},{"g":"topo","t":"Network topology","ru":"топология сети","ref":"Network topology is the way the parts (nodes) of a network are arranged and connected. The main types are bus, star, ring, mesh, tree and hybrid. More connections make a network more reliable but more expensive."},{"g":"topo","t":"Bus topology","ru":"шина","ref":"In a bus topology all computers are connected to one main cable, the backbone. Plus: it is simple to set up and extend, and if one computer fails, the rest of the network keeps working. Minus: if the backbone cable is damaged, the whole network can fail. Also, every computer can see all the data, so private communication between two computers is impossible."},{"g":"topo","t":"Star topology","ru":"звезда","ref":"In a star topology every device is connected to one central node by a separate connection, and all data goes through it. Plus: if one device or its link fails, the rest of the network is not affected. Minus: if the central node is damaged, all devices lose the connection."},{"g":"topo","t":"Ring topology","ru":"кольцо","ref":"In a ring topology each device is connected to its neighbour, so the connection forms a ring. Plus: it is easy to set up and quick to scale. Minus: data moves in one direction from node to node, so private transmission between two computers is impossible, and if one workstation shuts down, the whole network goes down."},{"g":"topo","t":"Mesh topology","ru":"ячеистая (полносвязная) сеть","ref":"In a mesh topology every device is connected directly to every other device, so it is very reliable. Plus: if one segment fails, the traffic goes by another route. Minus: it is very expensive to install, and the many extra connections can cause bandwidth problems."},{"g":"topo","t":"Tree topology","ru":"дерево","ref":"A tree topology connects computers like the branches of a tree. It combines bus and star topologies. Plus: it is flexible and easy to scale. The text names no minuses."},{"g":"topo","t":"Hybrid topology","ru":"гибридная топология","ref":"A hybrid topology mixes two or more different topologies (bus, mesh, ring, star, tree) in one network. The combination depends on the needs of a company. The text names no pros and cons."},{"g":"osi","t":"OSI model","ru":"модель OSI","ref":"The OSI model is a model that shows how data travels through a network. It has seven layers. It was adopted in 1984 by ISO (the International Organization for Standardization). Network specialists use it as a guide and to find problems."},{"g":"osi","t":"Application layer","ru":"прикладной уровень (7)","ref":"The application layer is responsible for generating data. It is the only layer the user sees: programs use it for email, file transfer (FTP) and web browsing (HTTP, HTTPS)."},{"g":"osi","t":"Presentation layer","ru":"уровень представления (6)","ref":"The presentation layer is responsible for encryption and formatting. It makes data readable for the receiving computer (for example, ASCII), encrypts and decrypts it, and compresses it."},{"g":"osi","t":"Session layer","ru":"сеансовый уровень (5)","ref":"The session layer is responsible for establishing a connection. It opens, keeps and closes sessions (connections between computers) and sets checkpoints, so after a break the transfer can continue from the last checkpoint."},{"g":"osi","t":"Transport layer","ru":"транспортный уровень (4)","ref":"The transport layer is responsible for delivery and sequencing. It cuts data into segments, checks for errors, controls the flow and sends the data again if something is lost. Protocols: TCP and UDP."},{"g":"osi","t":"Network layer","ru":"сетевой уровень (3)","ref":"The network layer is responsible for routing to the destination. It sends packets from one network to another, uses IP addresses and chooses the best route."},{"g":"osi","t":"Data link layer","ru":"канальный уровень (2)","ref":"The data link layer is responsible for delivery to a host in the local network. It moves data between two devices in the same network, cuts packets into frames and uses MAC addresses."},{"g":"osi","t":"Physical layer","ru":"физический уровень (1)","ref":"The physical layer is responsible for access to the media. It is the lowest layer: it sends raw bits through a cable or a wireless link."}];
let cur='all';
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function draw(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  let h='',last='';
  for(const it of Object.keys(G).filter(k=>k!=='all').flatMap(k=>ITEMS.filter(x=>x.g===k))){
    if(cur!=='all'&&it.g!==cur) continue;
    if(q&&!(it.t+' '+it.ru+' '+it.ref).toLowerCase().includes(q)) continue;
    if(cur==='all'&&it.g!==last){last=it.g;h+='<div class="gh">'+G[it.g]+'</div>'}
    h+='<div class="card"><div class="t">'+esc(it.t)+'</div><div class="ru">'+esc(it.ru)+'</div><div class="ref">'+esc(it.ref)+'</div>'
      +'</div>';
  }
  document.getElementById('list').innerHTML=h||'<div class="sub">Ничего не найдено.</div>';
}
function tabs(){document.getElementById('tabs').innerHTML=Object.keys(G).map(k=>'<button data-k="'+k+'" class="'+(k===cur?'on':'')+'">'+G[k]+'</button>').join('');
  document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{cur=b.dataset.k;tabs();draw()})}
document.getElementById('q').oninput=draw;tabs();draw();
</script></main></body></html>
